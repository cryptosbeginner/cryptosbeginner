<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Four crypto wallet types</title>
  <desc id="desc">Hardware, mobile, browser extension and desktop wallets compared by where keys live.</desc>
  <rect width="1200" height="520" fill="#0f172a"/>
  <text x="48" y="56" fill="#67e8f9" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">WALLET TYPES</text>
  <text x="48" y="100" fill="#ffffff" font-family="Georgia, serif" font-size="34">Where the keys live decides the risk</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="150" width="260" height="300" rx="24" fill="#ecfeff"/>
    <text x="72" y="198" fill="#155e75" font-size="22" font-weight="700">Hardware</text>
    <text x="72" y="238" fill="#334155" font-size="16">Keys stay on a</text>
    <text x="72" y="262" fill="#334155" font-size="16">dedicated device.</text>
    <text x="72" y="302" fill="#0f766e" font-size="15">Best for savings</text>
    <rect x="328" y="150" width="260" height="300" rx="24" fill="#eef2ff"/>
    <text x="352" y="198" fill="#3730a3" font-size="22" font-weight="700">Mobile</text>
    <text x="352" y="238" fill="#334155" font-size="16">Keys on a phone</text>
    <text x="352" y="262" fill="#334155" font-size="16">you use every day.</text>
    <text x="352" y="302" fill="#4338ca" font-size="15">Best for small spends</text>
    <rect x="608" y="150" width="260" height="300" rx="24" fill="#f5f3ff"/>
    <text x="632" y="198" fill="#5b21b6" font-size="22" font-weight="700">Extension</text>
    <text x="632" y="238" fill="#334155" font-size="16">Keys in a browser</text>
    <text x="632" y="262" fill="#334155" font-size="16">add-on for dApps.</text>
    <text x="632" y="302" fill="#6d28d9" font-size="15">Best for DeFi</text>
    <rect x="888" y="150" width="260" height="300" rx="24" fill="#f8fafc"/>
    <text x="912" y="198" fill="#0f172a" font-size="22" font-weight="700">Desktop</text>
    <text x="912" y="238" fill="#334155" font-size="16">Keys on a computer</text>
    <text x="912" y="262" fill="#334155" font-size="16">you control.</text>
    <text x="912" y="302" fill="#334155" font-size="15">Best if the PC is clean</text>
  </g>
</svg>
