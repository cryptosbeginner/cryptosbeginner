<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" fill="#ffffff" font-size="34" font-weight="800">Hardware wallets compared, October 2026</text>
  <text x="60" y="96" fill="#94a3b8" font-size="17">Prices from official stores. Verify live pricing before buying.</text>

  <g font-size="15">
    <!-- Header row -->
    <g font-weight="700" fill="#cbd5e1">
      <text x="60" y="150">Wallet</text>
      <text x="330" y="150">Price</text>
      <text x="480" y="150">Screen</text>
      <text x="660" y="150">Secure element</text>
      <text x="860" y="150">Open source</text>
      <text x="1030" y="150">Standout trait</text>
    </g>
    <line x1="40" y1="166" x2="1160" y2="166" stroke="#334155" stroke-width="1"/>

    <!-- OneKey Pro 2 : highlighted -->
    <rect x="40" y="182" width="1120" height="76" rx="14" fill="url(#pick)" opacity="0.92"/>
    <g fill="#ffffff">
      <text x="60" y="214" font-weight="800" font-size="17">OneKey Pro 2</text>
      <text x="60" y="238" font-size="13" opacity="0.85">Our pick</text>
      <text x="330" y="228" font-weight="800" font-size="17">$299</text>
      <text x="480" y="214" font-size="15">3.54" AMOLED touch</text>
      <text x="480" y="238" font-size="13" opacity="0.85">800 nits, fingerprint</text>
      <text x="660" y="214" font-size="15">4x EAL6+</text>
      <text x="660" y="238" font-size="13" opacity="0.85">unique in market</text>
      <text x="860" y="214" font-size="15">App + firmware</text>
      <text x="860" y="238" font-size="13" opacity="0.85">SE firmware closed</text>
      <text x="1030" y="214" font-size="15">Swap, perps, DeFi,</text>
      <text x="1030" y="238" font-size="15">stocks in one app</text>
    </g>

    <!-- OneKey Classic 1S -->
    <g fill="#e2e8f0">
      <text x="60" y="300" font-weight="700" font-size="16">OneKey Classic 1S</text>
      <text x="330" y="300" font-size="16">$99</text>
      <text x="480" y="292" font-size="14">1.54" mono OLED</text>
      <text x="480" y="312" font-size="12" fill="#94a3b8">buttons</text>
      <text x="660" y="300" font-size="14">1x EAL6+</text>
      <text x="860" y="292" font-size="14">App + firmware</text>
      <text x="860" y="312" font-size="12" fill="#94a3b8">SE firmware closed</text>
      <text x="1030" y="292" font-size="14">Same app, budget</text>
      <text x="1030" y="312" font-size="14">price</text>
    </g>
    <line x1="40" y1="330" x2="1160" y2="330" stroke="#1e293b" stroke-width="1"/>

    <!-- Trezor Safe 3 -->
    <g fill="#e2e8f0">
      <text x="60" y="368" font-weight="700" font-size="16">Trezor Safe 3</text>
      <text x="330" y="368" font-size="16">$59</text>
      <text x="480" y="360" font-size="14">0.96" mono OLED</text>
      <text x="480" y="380" font-size="12" fill="#94a3b8">buttons</text>
      <text x="660" y="368" font-size="14">EAL6+</text>
      <text x="860" y="360" font-size="14">Fully open</text>
      <text x="860" y="380" font-size="12" fill="#94a3b8">hardware + firmware</text>
      <text x="1030" y="360" font-size="14">Maximum</text>
      <text x="1030" y="380" font-size="14">auditability</text>
    </g>
    <line x1="40" y1="398" x2="1160" y2="398" stroke="#1e293b" stroke-width="1"/>

    <!-- Ledger Nano S Plus -->
    <g fill="#e2e8f0">
      <text x="60" y="436" font-weight="700" font-size="16">Ledger Nano S Plus</text>
      <text x="330" y="436" font-size="16">$59</text>
      <text x="480" y="428" font-size="14">1.18" mono</text>
      <text x="480" y="448" font-size="12" fill="#94a3b8">buttons</text>
      <text x="660" y="436" font-size="14">EAL5+ (ST33)</text>
      <text x="860" y="436" font-size="14">Closed</text>
      <text x="1030" y="428" font-size="14">Biggest app</text>
      <text x="1030" y="448" font-size="14">ecosystem (Ledger Live)</text>
    </g>
    <line x1="40" y1="466" x2="1160" y2="466" stroke="#1e293b" stroke-width="1"/>

    <!-- SafePal S1 -->
    <g fill="#e2e8f0">
      <text x="60" y="504" font-weight="700" font-size="16">SafePal S1</text>
      <text x="330" y="504" font-size="16">$49.99</text>
      <text x="480" y="496" font-size="14">1.3" color</text>
      <text x="480" y="516" font-size="12" fill="#94a3b8">buttons</text>
      <text x="660" y="504" font-size="14">EAL6+</text>
      <text x="860" y="504" font-size="14">Closed</text>
      <text x="1030" y="496" font-size="14">Air-gapped QR</text>
      <text x="1030" y="516" font-size="14">signing, cheapest</text>
    </g>
    <line x1="40" y1="534" x2="1160" y2="534" stroke="#1e293b" stroke-width="1"/>

    <!-- Ellipal Titan 2.0 -->
    <g fill="#e2e8f0">
      <text x="60" y="572" font-weight="700" font-size="16">Ellipal Titan 2.0</text>
      <text x="330" y="572" font-size="16">$169</text>
      <text x="480" y="564" font-size="14">4.0" touch</text>
      <text x="480" y="584" font-size="12" fill="#94a3b8">color IPS</text>
      <text x="660" y="572" font-size="14">EAL5+</text>
      <text x="860" y="572" font-size="14">Closed</text>
      <text x="1030" y="564" font-size="14">Metal body, fully</text>
      <text x="1030" y="584" font-size="14">air-gapped</text>
    </g>
    <line x1="40" y1="602" x2="1160" y2="602" stroke="#1e293b" stroke-width="1"/>

    <!-- Tangem -->
    <g fill="#e2e8f0">
      <text x="60" y="640" font-weight="700" font-size="16">Tangem (2-card set)</text>
      <text x="330" y="640" font-size="16">$54.90</text>
      <text x="480" y="640" font-size="14">None (NFC card)</text>
      <text x="660" y="640" font-size="14">EAL6+</text>
      <text x="860" y="632" font-size="14">App open,</text>
      <text x="860" y="652" font-size="14">card closed</text>
      <text x="1030" y="632" font-size="14">No screen, no battery,</text>
      <text x="1030" y="652" font-size="14">tap to sign</text>
    </g>
  </g>

  <text x="60" y="712" fill="#94a3b8" font-size="14">No hardware wallet is perfect. Match the device to your workflow: open-source purists pick Trezor, air-gap maximalists pick SafePal or Ellipal, minimalists pick Tangem, and everyone who wants hardware plus a full trading app picks OneKey.</text>
  <text x="60" y="738" fill="#64748b" font-size="13">Source: official stores and maker specs, October 2026. CryptosBeginner.</text>
</svg>
