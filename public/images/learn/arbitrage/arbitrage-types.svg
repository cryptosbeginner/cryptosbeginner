<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="70" fill="#4f46e5" font-size="20" font-weight="800" letter-spacing="4">7 TYPES OF CRYPTO ARBITRAGE</text>
  <text x="60" y="108" fill="#0f172a" font-size="32" font-weight="900">One idea, seven battlefields</text>

  <!-- Row 1 -->
  <g>
    <rect x="60" y="140" width="350" height="180" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="90" y="185" font-size="28">🔁</text>
    <text x="90" y="220" fill="#0f172a" font-size="19" font-weight="800">Cross-exchange</text>
    <text x="90" y="248" fill="#64748b" font-size="14">Buy on A, sell on B.</text>
    <text x="90" y="272" fill="#64748b" font-size="14">The classic. Needs two</text>
    <text x="90" y="296" fill="#64748b" font-size="14">verified accounts.</text>
  </g>
  <g>
    <rect x="425" y="140" width="350" height="180" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="455" y="185" font-size="28">🔺</text>
    <text x="455" y="220" fill="#0f172a" font-size="19" font-weight="800">Triangular</text>
    <text x="455" y="248" fill="#64748b" font-size="14">Three pairs, one exchange.</text>
    <text x="455" y="272" fill="#64748b" font-size="14">USDT → BTC → ETH → USDT.</text>
    <text x="455" y="296" fill="#64748b" font-size="14">No transfers needed.</text>
  </g>
  <g>
    <rect x="790" y="140" width="350" height="180" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="820" y="185" font-size="28">🌍</text>
    <text x="820" y="220" fill="#0f172a" font-size="19" font-weight="800">Cross-border</text>
    <text x="820" y="248" fill="#64748b" font-size="14">Regional premiums from</text>
    <text x="820" y="272" fill="#64748b" font-size="14">capital controls. Kimchi</text>
    <text x="820" y="296" fill="#64748b" font-size="14">premium hit ~50%.</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="60" y="340" width="350" height="180" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="90" y="385" font-size="28">📊</text>
    <text x="90" y="420" fill="#0f172a" font-size="19" font-weight="800">Funding rate</text>
    <text x="90" y="448" fill="#64748b" font-size="14">Long spot + short perps,</text>
    <text x="90" y="472" fill="#64748b" font-size="14">collect funding payments</text>
    <text x="90" y="496" fill="#64748b" font-size="14">every 8 hours.</text>
  </g>
  <g>
    <rect x="425" y="340" width="350" height="180" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="455" y="385" font-size="28">🤝</text>
    <text x="455" y="420" fill="#0f172a" font-size="19" font-weight="800">P2P</text>
    <text x="455" y="448" fill="#64748b" font-size="14">Buy cheap, resell at a</text>
    <text x="455" y="472" fill="#64748b" font-size="14">markup where exchanges</text>
    <text x="455" y="496" fill="#64748b" font-size="14">are hard to access.</text>
  </g>
  <g>
    <rect x="790" y="340" width="350" height="180" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="820" y="385" font-size="28">⚡</text>
    <text x="820" y="420" fill="#0f172a" font-size="19" font-weight="800">DEX / DeFi</text>
    <text x="820" y="448" fill="#64748b" font-size="14">AMM price vs CEX order</text>
    <text x="820" y="472" fill="#64748b" font-size="14">book gaps. Gas fees are</text>
    <text x="820" y="496" fill="#64748b" font-size="14">the silent killer.</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="60" y="540" width="540" height="160" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="585" font-size="28">⚠️</text>
    <text x="90" y="620" fill="#0f172a" font-size="19" font-weight="800">Flash loans <tspan fill="#b45309" font-size="14" font-weight="700">(advanced)</tspan></text>
    <text x="90" y="648" fill="#64748b" font-size="14">Borrow millions with zero collateral inside one transaction.</text>
    <text x="90" y="672" fill="#64748b" font-size="14">Needs smart-contract coding skill. MEV bots compete for the same trades.</text>
  </g>
  <g>
    <rect x="620" y="540" width="520" height="160" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="650" y="585" font-size="28">🤖</text>
    <text x="650" y="620" fill="#0f172a" font-size="19" font-weight="800">Statistical <tspan fill="#6d28d9" font-size="14" font-weight="700">(bots only)</tspan></text>
    <text x="650" y="648" fill="#64748b" font-size="14">Quant models trade price deviations that last seconds.</text>
    <text x="650" y="672" fill="#64748b" font-size="14">Effectively impossible to do by hand.</text>
  </g>
</svg>
