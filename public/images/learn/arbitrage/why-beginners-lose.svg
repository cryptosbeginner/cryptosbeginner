<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="600" rx="24" fill="#fef2f2"/>
  <text x="60" y="70" fill="#dc2626" font-size="20" font-weight="800" letter-spacing="4">WHY BEGINNERS LOSE AT ARBITRAGE</text>
  <text x="60" y="108" fill="#0f172a" font-size="32" font-weight="900">The gap closes faster than you can click</text>

  <g>
    <rect x="60" y="150" width="255" height="380" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <text x="90" y="200" font-size="34">🤖</text>
    <text x="90" y="245" fill="#0f172a" font-size="18" font-weight="800">Bots eat first</text>
    <text x="90" y="275" fill="#64748b" font-size="14">Price gaps last seconds.</text>
    <text x="90" y="299" fill="#64748b" font-size="14">Bots execute in</text>
    <text x="90" y="323" fill="#64748b" font-size="14">milliseconds. Manual</text>
    <text x="90" y="347" fill="#64748b" font-size="14">traders get leftovers.</text>
    <text x="90" y="400" fill="#dc2626" font-size="13" font-weight="700">Scanners check every</text>
    <text x="90" y="422" fill="#dc2626" font-size="13" font-weight="700">~4 seconds. You cannot</text>
    <text x="90" y="444" fill="#dc2626" font-size="13" font-weight="700">out-click that.</text>
  </g>
  <g>
    <rect x="335" y="150" width="255" height="380" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <text x="365" y="200" font-size="34">⏱️</text>
    <text x="365" y="245" fill="#0f172a" font-size="18" font-weight="800">Transfer trap</text>
    <text x="365" y="275" fill="#64748b" font-size="14">BTC needs ~10 min per</text>
    <text x="365" y="299" fill="#64748b" font-size="14">confirmation. The price</text>
    <text x="365" y="323" fill="#64748b" font-size="14">can erase your profit</text>
    <text x="365" y="347" fill="#64748b" font-size="14">while coins are moving.</text>
    <text x="365" y="400" fill="#dc2626" font-size="13" font-weight="700">Pros pre-position funds</text>
    <text x="365" y="422" fill="#dc2626" font-size="13" font-weight="700">on both exchanges to</text>
    <text x="365" y="444" fill="#dc2626" font-size="13" font-weight="700">skip the wait.</text>
  </g>
  <g>
    <rect x="610" y="150" width="255" height="380" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <text x="640" y="200" font-size="34">💸</text>
    <text x="640" y="245" fill="#0f172a" font-size="18" font-weight="800">Fee illusion</text>
    <text x="640" y="275" fill="#64748b" font-size="14">A 0.8% headline gap</text>
    <text x="640" y="299" fill="#64748b" font-size="14">minus ~1% in fees,</text>
    <text x="640" y="323" fill="#64748b" font-size="14">slippage, and network</text>
    <text x="640" y="347" fill="#64748b" font-size="14">costs = a loss.</text>
    <text x="640" y="400" fill="#dc2626" font-size="13" font-weight="700">Always compute the NET</text>
    <text x="640" y="422" fill="#dc2626" font-size="13" font-weight="700">spread before touching</text>
    <text x="640" y="444" fill="#dc2626" font-size="13" font-weight="700">anything.</text>
  </g>
  <g>
    <rect x="885" y="150" width="255" height="380" rx="18" fill="#7f1d1d"/>
    <text x="915" y="200" font-size="34">🚨</text>
    <text x="915" y="245" fill="#ffffff" font-size="18" font-weight="800">Scam bots</text>
    <text x="915" y="275" fill="#fecaca" font-size="14">"Guaranteed profit"</text>
    <text x="915" y="299" fill="#fecaca" font-size="14">arbitrage bots are built</text>
    <text x="915" y="323" fill="#fecaca" font-size="14">to drain your wallet.</text>
    <text x="915" y="347" fill="#fecaca" font-size="14">Never grant withdrawal</text>
    <text x="915" y="371" fill="#fecaca" font-size="14">permissions.</text>
    <text x="915" y="424" fill="#ffffff" font-size="13" font-weight="700">Fixed daily returns =</text>
    <text x="915" y="446" fill="#ffffff" font-size="13" font-weight="700">Ponzi packaging.</text>
  </g>
</svg>
