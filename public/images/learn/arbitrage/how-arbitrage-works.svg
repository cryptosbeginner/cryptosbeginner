<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="640" rx="24" fill="#0f172a"/>
  <text x="60" y="70" fill="#5eead4" font-size="20" font-weight="800" letter-spacing="4">HOW CRYPTO ARBITRAGE WORKS</text>
  <text x="60" y="108" fill="#ffffff" font-size="34" font-weight="900">Buy low here. Sell high there. Keep the gap.</text>

  <!-- Step 1 -->
  <g>
    <rect x="60" y="150" width="300" height="380" rx="20" fill="#1e293b"/>
    <circle cx="110" cy="200" r="24" fill="#6366f1"/>
    <text x="110" y="209" fill="#fff" font-size="22" font-weight="900" text-anchor="middle">1</text>
    <text x="150" y="196" fill="#cbd5e1" font-size="16" font-weight="700">BUY</text>
    <text x="150" y="220" fill="#94a3b8" font-size="14">Exchange A</text>
    <text x="90" y="290" fill="#fbbf24" font-size="44" font-weight="900">1 BTC</text>
    <text x="90" y="330" fill="#e2e8f0" font-size="26" font-weight="700">$67,000</text>
    <text x="90" y="370" fill="#94a3b8" font-size="15">You buy Bitcoin where</text>
    <text x="90" y="394" fill="#94a3b8" font-size="15">the price is lower.</text>
    <text x="90" y="470" fill="#64748b" font-size="13">Fee: ~0.1% ($67)</text>
  </g>

  <!-- Arrow 1 -->
  <g>
    <line x1="375" y1="340" x2="445" y2="340" stroke="#5eead4" stroke-width="4"/>
    <polygon points="445,328 465,340 445,352" fill="#5eead4"/>
    <text x="410" y="315" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle">transfer</text>
    <text x="410" y="375" fill="#64748b" font-size="12" text-anchor="middle">~10 min</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="460" y="150" width="300" height="380" rx="20" fill="#1e293b"/>
    <circle cx="510" cy="200" r="24" fill="#6366f1"/>
    <text x="510" y="209" fill="#fff" font-size="22" font-weight="900" text-anchor="middle">2</text>
    <text x="550" y="196" fill="#cbd5e1" font-size="16" font-weight="700">MOVE</text>
    <text x="550" y="220" fill="#94a3b8" font-size="14">Blockchain transfer</text>
    <text x="490" y="290" fill="#5eead4" font-size="44" font-weight="900">1 BTC</text>
    <text x="490" y="330" fill="#e2e8f0" font-size="26" font-weight="700">in transit</text>
    <text x="490" y="370" fill="#94a3b8" font-size="15">Price can move against</text>
    <text x="490" y="394" fill="#94a3b8" font-size="15">you while coins travel.</text>
    <text x="490" y="470" fill="#64748b" font-size="13">Network fee: ~$5</text>
  </g>

  <!-- Arrow 2 -->
  <g>
    <line x1="775" y1="340" x2="845" y2="340" stroke="#5eead4" stroke-width="4"/>
    <polygon points="845,328 865,340 845,352" fill="#5eead4"/>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="860" y="150" width="280" height="380" rx="20" fill="#1e293b"/>
    <circle cx="910" cy="200" r="24" fill="#6366f1"/>
    <text x="910" y="209" fill="#fff" font-size="22" font-weight="900" text-anchor="middle">3</text>
    <text x="950" y="196" fill="#cbd5e1" font-size="16" font-weight="700">SELL</text>
    <text x="950" y="220" fill="#94a3b8" font-size="14">Exchange B</text>
    <text x="890" y="290" fill="#34d399" font-size="44" font-weight="900">1 BTC</text>
    <text x="890" y="330" fill="#e2e8f0" font-size="26" font-weight="700">$67,400</text>
    <text x="890" y="370" fill="#94a3b8" font-size="15">You sell where the</text>
    <text x="890" y="394" fill="#94a3b8" font-size="15">price is higher.</text>
    <text x="890" y="470" fill="#64748b" font-size="13">Fee: ~0.1% ($67)</text>
  </g>

  <!-- Result bar -->
  <g>
    <rect x="60" y="555" width="1080" height="55" rx="14" fill="#064e3b"/>
    <text x="90" y="590" fill="#a7f3d0" font-size="18" font-weight="800">Gross gap $400  minus fees (~$139)  =  about $261 net profit</text>
  </g>
</svg>
