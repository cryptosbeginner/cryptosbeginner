<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">High-profile crypto failure timeline</title>
  <desc id="desc">Selected researched cases from 2014 to 2026, not a complete market census.</desc>
  <rect width="1200" height="420" fill="#0f172a"/>
  <text x="48" y="52" fill="#fda4af" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">SELECTED CASE TIMELINE</text>
  <text x="48" y="96" fill="#ffffff" font-family="Georgia, serif" font-size="32">From Mt. Gox to 2026 sunsets</text>
  <line x1="80" y1="230" x2="1120" y2="230" stroke="#64748b" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="140" cy="230" r="10" fill="#fda4af"/>
    <text x="140" y="170" fill="#fff" font-size="16" font-weight="700">2014</text>
    <text x="140" y="278" fill="#cbd5e1" font-size="15">Mt. Gox</text>
    <circle cx="300" cy="230" r="10" fill="#fda4af"/>
    <text x="300" y="170" fill="#fff" font-size="16" font-weight="700">2018</text>
    <text x="300" y="278" fill="#cbd5e1" font-size="15">BitConnect</text>
    <circle cx="460" cy="230" r="10" fill="#fdba74"/>
    <text x="460" y="170" fill="#fff" font-size="16" font-weight="700">2019</text>
    <text x="460" y="278" fill="#cbd5e1" font-size="15">QuadrigaCX</text>
    <circle cx="620" cy="230" r="10" fill="#fde68a"/>
    <text x="620" y="170" fill="#fff" font-size="16" font-weight="700">2021</text>
    <text x="620" y="278" fill="#cbd5e1" font-size="15">Iron Finance</text>
    <circle cx="800" cy="230" r="10" fill="#fca5a5"/>
    <text x="800" y="170" fill="#fff" font-size="16" font-weight="700">2022</text>
    <text x="800" y="278" fill="#cbd5e1" font-size="15">Terra, 3AC, FTX</text>
    <circle cx="980" cy="230" r="10" fill="#5eead4"/>
    <text x="980" y="170" fill="#fff" font-size="16" font-weight="700">2026</text>
    <text x="980" y="278" fill="#cbd5e1" font-size="15">Loopring, Goldfinch</text>
  </g>
  <text x="48" y="370" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">This is a researched sample, not the millions of unused meme tokens that simply stop trading.</text>
</svg>
